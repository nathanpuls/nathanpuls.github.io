<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raindrop.io Parser</title>
</head>
<body>
    <h1>Raindrop.io Link Redirector</h1>
    <p>Enter your username or username/tag in the URL parameter "usernametag" to redirect.</p>

    <script>
        // Fetch the username and collection info from a .txt file
        async function fetchRaindropData() {
            const response = await fetch('links.txt');
            const text = await response.text();

            const links = text.split('\n').filter(link => link.trim() !== '');
            const data = {};

            links.forEach(link => {
                const match = link.match(/https:\/\/raindrop\.io\/(\w+)\/(\w+-\d{8})/);
                if (match) {
                    const username = match[1];
                    const collectionInfo = match[2]; // Combines collectionName and collectionID
                    data[username] = collectionInfo;
                }
            });

            return data;
        }

        // Parse the URL parameter and redirect
        async function redirectToRaindrop() {
            const urlParams = new URLSearchParams(window.location.search);
            const usernametag = urlParams.get('usernametag');

            if (!usernametag) {
                console.error('No "usernametag" parameter provided.');
                return;
            }

            const data = await fetchRaindropData();

            const [username, tag] = usernametag.split('/');
            const collectionInfo = data[username];

            if (!collectionInfo) {
                console.error('Username not found in the data.');
                return;
            }

            let redirectURL = `https://raindrop.io/${username}/${collectionInfo}/search/sort=-created&perpage=30&page=0&search=`;

            if (tag) {
                redirectURL += `%23${encodeURIComponent(tag)}`;
            }

            window.location.href = redirectURL;
        }

        redirectToRaindrop();
    </script>
</body>
</html>
